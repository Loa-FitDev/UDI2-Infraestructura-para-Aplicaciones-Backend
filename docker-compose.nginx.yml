services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ~/app-backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_api
    networks:
      - app-network

  web_api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge